<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中嶋畜産</title>
<meta name="apple-mobile-web-app-title" content="中嶋畜産">
<meta name="theme-color" content="#0e0e10">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;background:#0e0e10;color:#d9a441;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px;box-sizing:border-box}
img{width:120px;height:120px;border-radius:26px}
a{display:inline-block;background:#d9a441;color:#0e0e10;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:12px;font-size:17px}
p{margin:0;color:#a8a29e;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div class="w">
<img src="icon-512.png" alt="">
<a id="go" href="https://claude.ai/artifact/JXquk19b8PF2SVrBhMTMDy">シフト・お知らせを開く</a>
<p>ホーム画面に追加すると、豚のアイコンから開けます。<br>ဖုန်း၏ ပင်မစခရင်သို့ ထည့်ပါ။</p>
</div>
<script>
// アイコンから開いたとき(?go=1)はすぐアプリへ移動。
// 初回はページを表示したまま、URLだけ ?go=1 に書き換え(この状態でホーム画面に追加すると、次からアイコンで直接開く)
var go=document.getElementById('go').href;
if(/[?&]go=1/.test(location.search)||navigator.standalone===true)location.replace(go);
else history.replaceState(null,'',location.pathname+'?go=1');
</script>
</body>
</html>
